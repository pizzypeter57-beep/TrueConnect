<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signs.css">
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Create Account</title>
</head>
<body>
    <div class="firsttext">
    <a class="firstlink"href="index.html"><h1>True<span style="font-weight: 100;">Connect</span></h1></a>
    </div>

    <img class="heroimg" src="logo.png" alt="">

    <div class="firsttext">
        <h2>Create Account</h2>
    </div>
    <section>
        <div>
            <form class="signupform" novalidate>
                <label for="name">Full Name</label>
                <input class="name" name="fullname" type="text" placeholder="   Enter your name" required><br>

                <label for="email">Email</label>
                <input class="email" name="email" type="email" placeholder="   Enter your email" required><br>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" minlength="8" required><br>

                <button type="submit">Create Account</button>
            </form>
        </div>
        <div class="divider"><span>Or</span></div>

<div class="social">
  <button type="button" aria-label="Continue with Apple">
    <i class="fa-brands fa-apple"></i>
  </button>
  <button type="button">
    <i class="fa-brands fa-google"></i>
  </button>
</div>
<div class="signin">
            <p>Already have an <br> account? <span><a class="signin-link", href="signin.html">Sign In</a></span></p>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
